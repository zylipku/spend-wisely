# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /model: iterative
  - override /hydra: default
  - override /logger: many_loggers

model:

  frozen_strategy:
    _target_: src.frozen_strategy.FrozenStrategy
    name: constant
    N0: 1

tags: ${model.frozen_strategy.name}

hydra:
  run:
    dir: ${paths.log_dir}/runs/${tags}/N0=${model.frozen_strategy.N0}/${now:%Y%m%d}-${now:%H%M%S}
