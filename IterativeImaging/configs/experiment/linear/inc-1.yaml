defaults:
  - default
  - _self_


model:

  frozen_strategy:
    name: linear
    N0: 1
    inc: 1.0

hydra:
  run:
    dir: ${paths.log_dir}/runs/${tags}/N0=${model.frozen_strategy.N0}_inc=${model.frozen_strategy.inc}/${now:%Y%m%d}-${now:%H%M%S}
